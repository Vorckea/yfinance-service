name: "Setup Python & Install Dependencies"
description: "Sets up Python environment and installs dependencies using Poetry"
inputs:
  python_version:
    type: string
    description: "Python version to use for the setup"
    required: true

  development:
    type: boolean
    description: "Whether to install development dependencies"
    required: false
    default: false
runs:
  using: "composite"
  steps:
  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: ${{ inputs.python_version }}

  - name: Cache Poetry
    uses: actions/cache@v4
    with:
      path: ~/.cache/pypoetry
      key: poetry-${{ runner.os }}-py${{ inputs.python_version }}-${{ hashFiles('**/poetry.lock', '**/pyproject.toml') }}
      restore-keys: |
        poetry-${{ runner.os }}-py${{ inputs.python_version }}-

  - name: Cache pip
    uses: actions/cache@v4
    with:
      path: ~/.cache/pip
      key: pip-${{ runner.os }}-py${{ inputs.python_version }}-${{ hashFiles('**/poetry.lock', '**/pyproject.toml') }}
      restore-keys: |
        pip-${{ runner.os }}-py${{ inputs.python_version }}-

  - name: Install Poetry
    run: pip install poetry || { echo "Poetry install failed"; exit 1; }
    shell: bash

  - name: Configure Poetry
    run: poetry config virtualenvs.create false
    shell: bash

  - name: Install Dependencies
    if: ${{ !inputs.development }}
    run: poetry install --no-root --only main || { echo "Dependency install failed"; exit 1; }
    shell: bash

  - name: Install Dev Dependencies
    if: ${{ inputs.development }}
    run: poetry install --no-root --with dev || { echo "Dev dependency install failed"; exit 1; }
    shell: bash

  - name: Report cache sizes
    if: always()
    run: |
      echo "Poetry cache:"; du -sh ~/.cache/pypoetry || true
      echo "pip cache:"; du -sh ~/.cache/pip || true
    shell: bash
outputs:
  python_version:
    description: "The Python version used"
    value: ${{ inputs.python_version }}
branding:
  icon: "package"
  color: "blue"

